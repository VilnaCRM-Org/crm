name: Build the dev image through the GitHub Actions layer cache
description: >-
  Builds the docker-compose `dev` service image (Dockerfile target `base`) with BuildKit against a
  type=gha layer cache, loads it under the tag compose resolves for that service, and exports
  DEV_IMAGE_PREBUILT=1 so the Makefile's compose `up` reuses it instead of rebuilding it (issue #136).
inputs:
  install-chromium:
    description: Build the Chromium variant the Lighthouse jobs need; it caches under its own scope.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Resolve the compose dev image tag and cache scope
      id: image
      shell: bash
      env:
        INSTALL_CHROMIUM: ${{ inputs.install-chromium }}
      run: |
        case "$INSTALL_CHROMIUM" in
          true) scope=dev-image-chromium ;;
          false) scope=dev-image ;;
          *) echo "install-chromium must be 'true' or 'false', got '$INSTALL_CHROMIUM'" >&2; exit 1 ;;
        esac
        make --no-print-directory env-bootstrap >/dev/null
        project="$(docker compose -f docker-compose.yml config --format json | jq -r '.name')"
        if [ -z "$project" ] || [ "$project" = "null" ]; then
          echo "docker compose did not resolve a project name" >&2
          exit 1
        fi
        {
          echo "tag=${project}-dev"
          echo "scope=${scope}"
        } >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      with:
        use: false

    - name: Build and load the dev image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      env:
        DOCKER_BUILD_SUMMARY: 'false'
        DOCKER_BUILD_RECORD_UPLOAD: 'false'
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: .
        file: Dockerfile
        target: base
        load: true
        push: false
        provenance: false
        sbom: false
        tags: ${{ steps.image.outputs.tag }}
        build-args: |
          INSTALL_CHROMIUM=${{ inputs.install-chromium }}
          INSTALL_PLAYWRIGHT_BROWSERS=false
        cache-from: type=gha,scope=${{ steps.image.outputs.scope }}
        cache-to: type=gha,mode=max,scope=${{ steps.image.outputs.scope }},ignore-error=true

    - name: Let the Makefile reuse the prebuilt dev image
      shell: bash
      run: echo 'DEV_IMAGE_PREBUILT=1' >> "$GITHUB_ENV"
