name: sandbox

on:
  pull_request:
    # A maintainer applies deploy-sandbox when this PR needs an ephemeral test environment.
    types: [labeled]

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROD_AWS_ACCOUNT_ID: ${{ vars.PROD_AWS_ACCOUNT_ID }}
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.label.name == 'deploy-sandbox' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      pull-requests: read
    steps:
      - name: Validate environment variables
        run: |
          if [ -z "${AWS_REGION}" ]; then
            echo "::error::AWS_REGION is not set"
            exit 1
          fi
          if [ -z "${PROD_AWS_ACCOUNT_ID}" ]; then
            echo "::error::PROD_AWS_ACCOUNT_ID is not set"
            exit 1
          fi
          if [ -z "${BRANCH_NAME}" ]; then
            echo "::error::BRANCH_NAME is not set"
            exit 1
          fi
          if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
            echo "::error::PR_NUMBER is not set"
            exit 1
          fi

      - name: Configure AWS Credentials (Sandbox Creation Trigger Role)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ env.PROD_AWS_ACCOUNT_ID }}:role/sandbox-crm-creation-trigger-role
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Start Pipeline Execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The label event may have waited in a runner queue while the PR closed.
          current_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          if jq -e --arg repo "${GITHUB_REPOSITORY}" \
            '.state == "open" and .head.repo.full_name == $repo and
             any(.labels[]?; .name == "deploy-sandbox")' \
            <<< "${current_pr}" >/dev/null; then
            :
          else
            eligibility_status=$?
            if [ "${eligibility_status}" -ne 1 ]; then
              echo "::error::Failed to parse current PR eligibility"
              exit "${eligibility_status}"
            fi
            echo "::notice::PR is no longer eligible for a sandbox"
            exit 0
          fi

          aws codepipeline start-pipeline-execution --name "sandbox-crm-creation" \
            --variables \
            "name=BRANCH_NAME,value=${BRANCH_NAME}" \
            "name=PR_NUMBER,value=${PR_NUMBER}" \
            "name=IS_PULL_REQUEST,value=1"
