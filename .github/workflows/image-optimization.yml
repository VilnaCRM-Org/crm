name: image optimization

on:
  pull_request:
    paths:
      - '**.jpg'
      - '**.jpeg'
      - '**.png'
      - '**.webp'
      # Self-trigger: without this, a change to this workflow (an action repin, an input
      # rename) never runs the job it changes, so the regression surfaces on some later PR
      # that happens to touch an image. With no image in the diff the action is a no-op.
      - '.github/workflows/image-optimization.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: calibreapp/image-actions
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      # Issue #174: this was pinned to a `main`-branch commit, so the pinned code never
      # corresponded to a reviewed release. Repinned to the 1.5.0 release-tag commit; both
      # revisions declare the same inputs, so the repin is input-compatible.
      #
      # `GITHUB_TOKEN`, not `githubToken`: the action declares the former, and Actions maps
      # input names verbatim (`INPUT_GITHUBTOKEN` vs `INPUT_GITHUB_TOKEN`), so the old spelling
      # was an unrecognized input that the action never read. It worked only because the
      # declared default is `${{ github.token }}` — the same value.
      - name: Compress Images
        uses: calibreapp/image-actions@9d037c06280028c110ff61c433ad4dc7d33c3c43 # 1.5.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ignorePaths: 'node_modules/**,tests/**'
