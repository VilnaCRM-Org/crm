name: performance testing

on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    name: lighthouse ${{ matrix.formFactor }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        formFactor: [desktop, mobile]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Build dev image with Chromium
        run: INSTALL_CHROMIUM=true make build-dev-chromium

      - name: Start container
        run: INSTALL_CHROMIUM=true make start

      - name: Run ${{ matrix.formFactor }} performance test
        run: make lighthouse-${{ matrix.formFactor }}

      - name: Upload ${{ matrix.formFactor }} Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-${{ matrix.formFactor }}-reports
          path: lhci-reports-${{ matrix.formFactor }}
          if-no-files-found: ignore
          retention-days: 7
