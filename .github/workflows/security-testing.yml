name: security testing

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
  schedule:
    - cron: '0 6 * * 1'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['typescript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config: |
            paths-ignore:
              - tests

      - name: Autobuild
        uses: github/codeql-action/autobuild@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          category: '/language:${{matrix.language}}'

  # Issue #158: the preloaded-auth-token seed is a test-only seam. This gate scans the emitted
  # bundle, not config source text, so a build that would ship an ungated auth-state seed fails
  # here. It runs on every pull request rather than behind a paths filter — the seam can be
  # reintroduced from src/, rsbuild.config.ts, .env, or the container wiring alike. The `push`
  # and `schedule` triggers above exist for the CodeQL baseline only, so this job opts out of
  # them: two docker image builds per merge and per week buy nothing the pull-request run
  # already proved.
  auth-seed-gate:
    name: preloaded-auth seed gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      # Only the dev image is needed: the gate builds its own production image and runs the
      # scanner with `docker compose run`, so mockoon/apollo readiness is pure flake surface.
      - name: Start container
        run: make start-dev

      - name: Scan the deployable image and the opted-in bundle
        run: make check-auth-seed-gate

  # Issue #113: the browser security-header baseline is enforced against the emitted artifact,
  # not config text. The gate builds the deployable `production` image, boots it twice — the
  # committed serve.json, then with APP_CONFIG_* API overrides that the entrypoint must surface
  # in the CSP connect-src — and asserts every header of config/security-headers.json on the
  # HTML shell, a deep route, the manifest and a hashed static asset. Pull requests only, for
  # the same reason as the seed gate above: the push and schedule triggers exist for CodeQL.
  security-headers:
    name: security headers
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      - name: Build the production image and assert the header baseline
        run: make check-security-headers
