name: security testing

on:
  pull_request:
    branches: ['main']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['typescript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: '/language:${{matrix.language}}'

  # Issue #158: the preloaded-auth-token seed is a test-only seam. This gate scans the emitted
  # bundle, not config source text, so a build that would ship an ungated auth-state seed fails
  # here. It runs unconditionally rather than behind a paths filter — the seam can be
  # reintroduced from src/, rsbuild.config.ts, .env, or the container wiring alike.
  auth-seed-gate:
    name: preloaded-auth seed gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ vars.NODE_VERSION }}

      # Only the dev image is needed: the gate builds its own production image and runs the
      # scanner with `docker compose run`, so mockoon/apollo readiness is pure flake surface.
      - name: Start container
        run: make start-dev

      - name: Scan the deployable image and the opted-in bundle
        run: make check-auth-seed-gate
