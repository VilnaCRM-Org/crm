name: mutation testing

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: shard ${{ matrix.index }}
    runs-on: ubuntu-latest
    # Budget: the whole workflow must stay under 15 minutes. Shards fail rather
    # than silently regress the runtime the honest-classification settings buy.
    timeout-minutes: 12
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Keep this list and the merge job's MUTATION_SHARD_TOTAL in lock-step:
        # index must be [0 .. TOTAL-1]. A mismatch fails closed at the merge gate.
        index: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ vars.NODE_VERSION }}

      # The mutation-config hash is part of the key: Stryker's incremental file
      # only invalidates on source/test changes, so without it a run would reuse
      # per-mutant statuses decided under different classification settings.
      - name: Restore mutation incremental cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental-${{ matrix.index }}.json
          key: mutation-incremental-shard-${{ matrix.index }}-${{ hashFiles('stryker.config.mjs', 'stryker.shard.config.mjs', 'jest.mutation.config.ts', 'tsconfig.stryker.json', 'scripts/ci/mutation-scope.mjs') }}-${{ github.run_id }}
          restore-keys: |
            mutation-incremental-shard-${{ matrix.index }}-${{ hashFiles('stryker.config.mjs', 'stryker.shard.config.mjs', 'jest.mutation.config.ts', 'tsconfig.stryker.json', 'scripts/ci/mutation-scope.mjs') }}-

      - name: Start dev container
        run: make start-dev

      - name: Run mutation shard (incremental)
        run: make test-mutation-shard MUTATION_SHARD_INDEX=${{ matrix.index }} MUTATION_SHARD_TOTAL=8 MUTATION_INCREMENTAL=1

      - name: Upload shard report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-shard-${{ matrix.index }}
          path: reports/mutation/mutation-shard-${{ matrix.index }}.json
          retention-days: 7
          if-no-files-found: error

      - name: Stop docker test environment
        if: always()
        run: make down

  merge:
    name: merge and enforce gate
    needs: shard
    # Run even when a shard failed so the gate fails CLOSED. A skipped required
    # check would otherwise count as a pass and bypass the mutation gate.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Fail if any mutation shard did not succeed
        if: needs.shard.result != 'success'
        env:
          SHARD_RESULT: ${{ needs.shard.result }}
        run: |
          echo "::error::Mutation shards did not all succeed (result=$SHARD_RESULT); failing the gate."
          exit 1

      - name: Download shard reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mutation-shard-*
          path: reports/mutation
          merge-multiple: true

      - name: Start dev container
        run: make start-dev

      - name: Merge reports and enforce mutation-score gate
        run: make merge-mutation-reports MUTATION_SHARD_TOTAL=8

      - name: Stop docker test environment
        if: always()
        run: make down
