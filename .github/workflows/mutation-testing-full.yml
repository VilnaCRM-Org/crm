name: mutation testing (scheduled full)

on:
  # Weekly authoritative pass: full, from-scratch run over the whole scope. Tune
  # the cadence (e.g. nightly '0 3 * * *') against CI cost.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  shard:
    name: full shard ${{ matrix.index }}
    runs-on: ubuntu-latest
    # Kill switch, not a target. This pass is cold by definition, which is the
    # ~6-7 min case the pull-request shards also measure; failing at twice that
    # surfaces a runtime regression instead of burning a scheduled runner.
    timeout-minutes: 12
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Start dev container
        run: make start-dev

      # No cache restore: this pass runs cold and from scratch so the score cannot
      # inherit stale reused results. --incremental still writes a fresh cache.
      - name: Run full mutation shard
        run: make test-mutation-shard MUTATION_SHARD_INDEX=${{ matrix.index }} MUTATION_SHARD_TOTAL=8 MUTATION_INCREMENTAL=1

      # Key must match mutation-testing.yml so pull requests can restore it, and
      # must carry the mutation-config, tsconfig-chain, dependency and container
      # hash so any change to how mutants are classified starts cold.
      - name: Save refreshed mutation incremental cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental-${{ matrix.index }}.json
          key: mutation-incremental-shard-${{ matrix.index }}-${{ hashFiles('stryker.config.mjs', 'stryker.shard.config.mjs', 'jest.mutation.config.ts', 'tsconfig.stryker.json', 'tsconfig.json', 'tsconfig.paths.json', 'scripts/ci/mutation-scope.mjs', 'package.json', 'bun.lock', 'Dockerfile', 'docker-compose.yml', 'Makefile') }}-${{ github.run_id }}

      - name: Upload shard report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-shard-${{ matrix.index }}
          path: reports/mutation/mutation-shard-${{ matrix.index }}.json
          retention-days: 7
          if-no-files-found: error

      - name: Stop docker test environment
        if: always()
        run: make down

  merge:
    name: merge and enforce gate
    needs: shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Hang guard only — this job runs no mutants. It measures ~1m30s (container
    # start plus the merge script), so the cap is headroom, not a budget: timing
    # out here would fail the gate closed over work the shards already paid for.
    timeout-minutes: 8
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Fail if any mutation shard did not succeed
        if: needs.shard.result != 'success'
        env:
          SHARD_RESULT: ${{ needs.shard.result }}
        run: |
          echo "::error::Mutation shards did not all succeed (result=$SHARD_RESULT); failing the gate."
          exit 1

      - name: Download shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-shard-*
          path: reports/mutation
          merge-multiple: true

      - name: Start dev container
        run: make start-dev

      - name: Merge reports and enforce mutation-score gate
        run: make merge-mutation-reports MUTATION_SHARD_TOTAL=8

      - name: Stop docker test environment
        if: always()
        run: make down
