name: static testing

on:
  pull_request:
    branches: ['main']
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          # The ADR drift gate diffs against the merge base, which a shallow clone lacks.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      - name: Start container
        run: make start

      - name: Run all linters
        run: make lint

      # The ADR drift gate is a pull-request policy: it needs the base branch, the pull-request
      # body and its labels, none of which a merge_group event carries. A queue run re-checks the
      # merged tree with `make lint` and `make codegen-check` only; the drift verdict was already
      # decided on the pull request that the queue entry was built from.
      #
      # The gate resolves a merge base against origin/main. fetch-depth: 0 normally provides it;
      # fetching explicitly makes the gate independent of that behaviour rather than failing
      # closed on a missing ref.
      - name: Fetch the base branch for the ADR drift diff
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      # Written to files rather than exported: `docker compose exec` does not carry host
      # environment into the dev container, and interpolating a pull-request body into a shell
      # command would be an injection vector. `reports/` is gitignored.
      - name: Record pull-request context for the ADR drift gate
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          # JSON, not a joined string: a label may legitimately contain the separator.
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          mkdir -p reports/adr-drift
          printf '%s' "$PR_BODY" > reports/adr-drift/pr-body.txt
          printf '%s' "$PR_LABELS" > reports/adr-drift/pr-labels.txt

      - name: Fail undocumented architecture changes
        if: github.event_name == 'pull_request'
        run: make check-adr-drift

      - name: Verify API contract versions and generated types are in sync
        run: make codegen-check
