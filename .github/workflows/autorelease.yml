name: generate changelog and create release

# Reusable, not push-triggered (issue #185): main verification calls this workflow from its
# `release` job, which needs its lint and unit jobs, so a release is only ever cut from a
# commit whose merged tree passed them. The release commit carries the changelog action's
# default `[skip ci]`, so it does not start a verification (and a release) of its own.
on:
  workflow_call:
    secrets:
      VILNACRM_APP_ID:
        required: true
      VILNACRM_APP_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  tip:
    name: verify main tip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      current: ${{ steps.tip.outputs.current }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      # main may have moved past the verified commit while lint and unit ran. The newer push is
      # verified and released by its own run, so this one skips rather than racing it.
      - name: Release only while main is still at the verified commit
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERIFIED_SHA: ${{ github.sha }}
        run: sh scripts/ci/check-release-tip.sh

  build:
    needs: tip
    if: ${{ needs.tip.outputs.current == 'true' }}
    runs-on: ubuntu-latest
    # The caller already runs one verification at a time; this keeps any second caller from
    # aborting an in-flight release.
    concurrency:
      group: release-train
      cancel-in-progress: false
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      # SLSA provenance and keyless cosign signatures for the tarball and the image (issue #136).
      id-token: write
      attestations: write

    steps:
      - name: Verify the release App credentials are available
        env:
          APP_ID: ${{ secrets.VILNACRM_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.VILNACRM_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::VILNACRM_APP_ID and VILNACRM_APP_PRIVATE_KEY must be" \
              "visible to this repository. They are organisation secrets. Grant" \
              "this repository access to both before re-running."
            exit 1
          fi

      # Issue #174: tibdex/github-app-token is archived. actions/create-github-app-token is
      # GitHub's maintained equivalent and a drop-in for this usage.
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # `app-id`, not the newer `client-id`: the org secret holds the App ID. Switching
          # inputs would need a new secret carrying the App's Client ID.
          app-id: ${{ secrets.VILNACRM_APP_ID }}
          private-key: ${{ secrets.VILNACRM_APP_PRIVATE_KEY }}
          # Without this the minted token inherits every permission the App installation
          # holds. The release flow only commits the changelog/version bump, pushes the tag,
          # and creates the release — all `contents`.
          permission-contents: write

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          token: ${{ steps.generate_token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Check the release version cannot collide with an existing tag
        run: make check-release-version

      # `git-push: false`: the action's own push sends the branch ref and the tag ref in one
      # non-atomic command, so a branch rejected by protection still lands its tag and every
      # later run dies on it. The step below pushes the branch first and the tag only after.
      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@469f0e5e35831fbd1962706f29f65daf0a5723f2 # v6.5.0
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          output-file: 'CHANGELOG.md'
          version-file: 'package.json'
          git-push: false

      - name: Push the release commit, then its tag
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          RELEASE_TOKEN: ${{ steps.generate_token.outputs.token }}
          RELEASE_TAG: ${{ steps.changelog.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          APP_SLUG: ${{ steps.generate_token.outputs.app-slug }}
        run: |
          set -euo pipefail

          remote="https://x-access-token:${RELEASE_TOKEN}@github.com/${REPOSITORY}.git"
          push_log="$RUNNER_TEMP/release-push.log"

          if ! git push "$remote" "HEAD:${GITHUB_REF}" 2> "$push_log"; then
            cat "$push_log" >&2
            if grep -q 'GH006' "$push_log"; then
              echo "::error::main's branch protection declined the release commit (GH006)." \
                "The release App '${APP_SLUG}' cannot bypass the required status checks, so" \
                "no release can land until an admin grants it a bypass. Nothing was pushed" \
                "and no tag exists on the remote. Steps: CONTRIBUTING.md, 'Releases and the" \
                "changelog'."
            fi
            exit 1
          fi

          git push "$remote" "refs/tags/${RELEASE_TAG}"

      - name: Pack the release tarball
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        run: make release-tarball

      # Every dynamic value goes through env, never `${{ }}` interpolation inside the script, and
      # the body arrives from a file so generated changelog text can never be read as a gh flag.
      - name: Create Release
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.changelog.outputs.tag }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.clean_changelog }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          tarballs=(release/*.tar.gz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one tarball in release/, found ${#tarballs[@]};" \
              "the make release-tarball step did not produce the release asset"
            exit 1
          fi

          notes="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$notes"

          gh release create "$RELEASE_TAG" "${tarballs[0]}" \
            --title "$RELEASE_TAG" \
            --notes-file "$notes"

      - name: Log in to the GitHub Container Registry
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

      - name: Publish the production image
        id: publish_image
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        run: make publish-image

      # Provenance runs only after the release, the tarball and the image are all published: the
      # tag is already on the remote, so a signing outage here must not strand it without them.
      # The digest is what `docker push` reported for the tags just pushed, so the attestation
      # names the exact manifest rather than a tag that can move. No storage record: that needs
      # the extra artifact-metadata permission and adds nothing to `gh attestation verify`.
      - name: Attest the production image
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/vilnacrm-org/crm
          subject-digest: ${{ steps.publish_image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest the release tarball
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release/crm-dist-*.tar.gz'

      # Keyless cosign signatures beside the provenance (issue #136), made last for the same reason:
      # the Fulcio certificate binds each one to this workflow's OIDC identity and its Rekor entry
      # is public, so nothing is signed that is not already published under the tag.
      - name: Install cosign
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Sign the production image
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          IMAGE_DIGEST: ${{ steps.publish_image.outputs.digest }}
        run: cosign sign --yes "ghcr.io/vilnacrm-org/crm@${IMAGE_DIGEST}"

      - name: Sign the release tarball
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.changelog.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          tarballs=(release/crm-dist-*.tar.gz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one tarball in release/, found ${#tarballs[@]}"
            exit 1
          fi

          bundle="${tarballs[0]}.sigstore.json"
          cosign sign-blob --yes --bundle "$bundle" "${tarballs[0]}"
          gh release upload "$RELEASE_TAG" "$bundle"
