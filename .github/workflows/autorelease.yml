name: generate changelog and create release

on:
  push:
    branches: ['main']
    paths-ignore:
      - 'package.json'
      - 'CHANGELOG.md'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Issue #174: tibdex/github-app-token is archived. actions/create-github-app-token is
      # GitHub's maintained equivalent and a drop-in for this usage.
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # `app-id`, not the newer `client-id`: the org secret holds the App ID. Switching
          # inputs would need a new secret carrying the App's Client ID.
          app-id: ${{ secrets.VILNACRM_APP_ID }}
          private-key: ${{ secrets.VILNACRM_APP_PRIVATE_KEY }}
          # Without this the minted token inherits every permission the App installation
          # holds. The release flow only commits the changelog/version bump, pushes the tag,
          # and creates the release — all `contents`.
          permission-contents: write
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          token: ${{ steps.generate_token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@3c4970b6573374889b897403d2f1278c395ea0df # v5
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          output-file: 'CHANGELOG.md'
          version-file: 'package.json'
      # Issue #174: actions/create-release is archived and unmaintained. `gh release create` is
      # equivalent for this usage and removes a third-party action instead of swapping one in.
      # The tag already exists at this point — the changelog action creates and pushes it.
      # Every dynamic value goes through env, never `${{ }}` interpolation inside the script, and
      # the body arrives on stdin so generated changelog text can never be read as a gh flag.
      - name: Create Release
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.changelog.outputs.tag }}
          RELEASE_BODY: ${{ steps.changelog.outputs.clean_changelog }}
        run: |
          printf '%s\n' "$RELEASE_BODY" |
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file -
