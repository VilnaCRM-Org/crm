services:
  prod:
    build:
      context: .
      dockerfile: Dockerfile
      # The ephemeral harness image, never the deployable `production` target: only this
      # stage compiles in the preloaded-auth seed the Playwright, visual and Lighthouse
      # suites rely on to reach the protected home route (issue #158).
      target: test-harness
      args:
        REACT_APP_LHCI_PRELOADED_AUTH_TOKEN: ${LHCI_PRELOADED_AUTH_TOKEN-}
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      # Runtime configuration (issue #145). Rendered into the built HTML shell by the container
      # entrypoint, so the same image serves any environment. Empty means "keep the committed
      # default", which is what local, e2e and Lighthouse runs use.
      - APP_CONFIG_API_BASE_URL=${APP_CONFIG_API_BASE_URL-}
      - APP_CONFIG_GRAPHQL_URL=${APP_CONFIG_GRAPHQL_URL-}
      - APP_CONFIG_FLAG_FORGOT_PASSWORD=${APP_CONFIG_FLAG_FORGOT_PASSWORD-}
      - APP_CONFIG_FLAG_OAUTH_PROVIDERS=${APP_CONFIG_FLAG_OAUTH_PROVIDERS-}
      - APP_CONFIG_FLAG_REMEMBER_ME=${APP_CONFIG_FLAG_REMEMBER_ME-}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - crm-network

  playwright:
    build:
      context: .
      dockerfile: Playwright.Dockerfile
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '9324:9324'
    environment:
      - REACT_APP_PROD_CONTAINER_API_URL=http://prod:3001
      # GitHub runners export CI=true; empty locally keeps forbidOnly false and
      # preserves `.only` convenience. Without this, the runner's CI never crosses
      # the compose boundary and playwright.config.ts's forbidOnly is inert (#190).
      - CI=${CI-}
    networks:
      - crm-network

  apollo:
    build:
      context: .
      dockerfile: Apollo.Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - '${GRAPHQL_PORT:-4000}:${GRAPHQL_PORT:-4000}'
    healthcheck:
      # Apollo Server 4 returns HTTP 400 for GET /graphql without a query, and the image
      # ships wget (busybox) but not curl. POST a tiny query so the check reflects real health.
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          '--header=Content-Type: application/json',
          '--post-data={"query":"{__typename}"}',
          'http://localhost:${GRAPHQL_PORT:-4000}/${GRAPHQL_API_PATH:-graphql}',
        ]
    networks:
      - crm-network

  k6:
    profiles: ['load']
    build:
      context: .
      dockerfile: ./tests/load/dockerfile
    depends_on:
      prod:
        condition: service_healthy
    volumes:
      - ./tests/load:/loadTests
    networks:
      - crm-network

networks:
  crm-network:
    external: true
    name: crm-network
